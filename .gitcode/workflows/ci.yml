name: CI

# GitCode（AtomGit Action）流水线：与 .github/workflows/ci.yml 同一套验证口径。
# 注意：GitCode Action 当前为内测功能，需仓库开通「代码化流水线」后才会触发。
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  enable: true
  max: 1
  exceed-action: QUEUE

jobs:
  python-tests:
    name: Python engine and content checks
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: 检出代码
        uses: checkout
      - name: 设置 Python
        uses: setup-python
        with:
          python-version: '3.12'
      - name: Setup Node.js for JS grading
        uses: setup-node
        with:
          node-version: '20'
      # GitCode 托管 Runner 在国内，PyPI 直连常超时：先试官方源，失败退清华镜像，
      # 最后用 import yaml 作为硬门禁（装没装上不重要，导入得到才算数）。
      - name: Install CI dependencies
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" -m pip install -q -r requirements-ci.txt             || "$PY" -m pip install -q -r requirements-ci.txt                  -i https://pypi.tuna.tsinghua.edu.cn/simple
          "$PY" -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: 版本探针
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          command -v python || command -v python3
          python --version || python3 --version
          command -v node && node --version
      # setup-python 在不同资源池可能只装 python3（无 python 别名），
      # 这里显式解析解释器路径，避免 1 秒即失败的 "command not found"。
      - name: 全量单元测试
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" -m unittest discover -s tests -v
      - name: 课程内容校验
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" tests/validate_content.py
      - name: web 生成产物可复现
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" web/gen_data.py
          git diff --exit-code -- web/data.js web/engine.js

  android-build:
    name: Android build - assembleDebug and lint
    runs-on: [ubuntu-latest, x64, medium]
    needs: [python-tests]
    steps:
      - name: 检出代码
        uses: checkout
      - name: 设置 JDK
        uses: setup-jdk
        with:
          jdk-version: '17'
          distribution: 'temurin'
      - name: 缓存 Gradle
        uses: cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew
      # GitCode 托管 Runner 不预装 Android SDK，需自行安装（脚本幂等，
      # GitHub runner 上已装则直接复用）
      - name: 准备 Android SDK
        run: bash scripts/ci/install_android_sdk.sh
      - name: JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Build unsigned Release APK for R8 check
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: 构建产物探针
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" tests/ci_apk_probe.py app/build/outputs/apk/debug/app-debug.apk

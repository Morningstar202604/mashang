name: CI

# GitCode（AtomGit Action）流水线：与 .github/workflows/ci.yml 同一套验证口径。
# 注意：GitCode Action 当前为内测功能，需仓库开通「代码化流水线」后才会触发。
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  enable: true
  max: 1
  exceed-action: QUEUE

jobs:
  # 说明：GitCode 托管 Runner 不预装 Android SDK，且到 dl.google.com 的出网被限制，
  # 无法在此平台完成 Android 构建。为避免制造「看起来绿但没真构建」的假象，
  # 本流水线只跑可稳定执行的门禁（引擎/内容/同源/JS 判题）；
  # Android 构建与签名发布由 GitHub Actions 承担（三仓实跑，见 README）。
  python-tests:
    name: Python engine and content checks
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: checkout
      - name: Setup Python
        uses: setup-python
        with:
          python-version: '3.13'
      - name: Setup Node.js for JS grading
        uses: setup-node
        with:
          node-version: '20'
      - name: Version probe
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" --version
          node --version
      - name: Full unit tests
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" -m unittest discover -s tests -v
      - name: Content validation
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" tests/validate_content.py
      - name: Pages assets sync
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" tools/sync_pages_assets.py
          git diff --exit-code -- docs/catalog.json docs/content_packs docs/web

      - name: Page link check
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" tools/check_links.py

      - name: Web artifacts reproducible
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" web/gen_data.py
          git diff --exit-code -- web/data.js web/engine.js
      - name: APK probe script self-test
        run: |
          set -euo pipefail
          PY=$(command -v python || command -v python3)
          "$PY" -m unittest tests.test_apk_probe -v
